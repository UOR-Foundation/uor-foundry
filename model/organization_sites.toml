# model/organization_sites.toml --- full lifecycle records, activation, and isolation for organization sites.
#
# Conformance ID: OS-01 (suite: organization-sites)

spec = "foundry/organization-sites/1"

[policy]
activation_minimum_distinct_administrators = 2
require_physical_security_assessment = true
require_accessibility_assessment = true
prohibit_seeded_site_privileges = true
require_parent_organization_active = true
enforce_cross_org_isolation = true

