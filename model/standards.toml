# model/standards.toml --- OSCAL catalogs, profile resolution, component/system records, inheritance, and authenticated assessments.
#
# Conformance ID: ST-01 (suite: standards-oscal)

spec = "foundry/standards-oscal/1"

[policy]
mandatory_base_profile = "CAT-PRISM-BASE"
prohibit_unsupported_inapplicability = true
prohibit_weakening_base_profile = true
require_conforming_verdict = true
require_authenticated_assessor = true
require_authoritative_coverage = true
require_explicit_inheritance = true
enforce_cross_org_isolation = true

[[catalogs]]
catalog_id = "CAT-PRISM-BASE"
standard_id = "PRISM-BASE-PROFILE"
canonical_id = "PrismPM Base Security & Integrity Profile"
edition = "2026.1"
title = "PrismPM Base Runtime and Verifiable Compilation Baseline"
controls = [
  { id = "PRISM-BASE-01", title = "Cryptographic Artifact Verification", statement = "All runtime artifacts and models must be verified against immutable cryptographic hashes." },
  { id = "PRISM-BASE-02", title = "Deterministic Wasm Sandbox Execution", statement = "Code execution must occur within memory-isolated, deterministic WebAssembly runtimes." },
  { id = "PRISM-BASE-03", title = "Honesty Gate Evidence Verification", statement = "All claimed capabilities must be bound to verifiable automated test oracles without mock shortcuts." }
]

[[catalogs]]
catalog_id = "CAT-ISO-27034-1"
standard_id = "ISO-27034-1-2011"
canonical_id = "ISO/IEC 27034-1:2011"
edition = "2011-cor1-2014"
title = "Application Security - Overview and Concepts"
controls = [
  { id = "ISO-27034-1:ASC-AUDIT", title = "Application Security Control Auditability", statement = "Application security controls must maintain auditable traces and non-repudiation." },
  { id = "ISO-27034-1:ASC-LIFECYCLE", title = "ASC Life Cycle Integration", statement = "Security controls must be integrated continuously across application development and execution lifecycles." }
]

[[catalogs]]
catalog_id = "CAT-ISO-27034-5"
standard_id = "ISO-27034-5-2017"
canonical_id = "ISO/IEC 27034-5:2017"
edition = "2017"
title = "Application Security - Protocols and ASC Data Structure"
controls = [
  { id = "ISO-27034-5:ASC-DATA-STRUCT", title = "ASC Data Structure Representation", statement = "Security controls must be structured as machine-readable verified data definitions." },
  { id = "ISO-27034-5:PROTOCOL-INTEG", title = "Application Security Protocol Integrity", statement = "Cryptographic protocol exchanges must ensure tamper-evidence and authenticated origin." }
]

[[catalogs]]
catalog_id = "CAT-ISO-27005"
standard_id = "ISO-27005-2022"
canonical_id = "ISO/IEC 27005:2022"
edition = "2022"
title = "Information Security Risk Management"
controls = [
  { id = "ISO-27005:RISK-CRITERIA", title = "Risk Assessment Criteria", statement = "Establish explicit quantitative criteria for availability, integrity, and identity risks." },
  { id = "ISO-27005:RISK-TREATMENT", title = "Risk Treatment and Control Verification", statement = "Risk treatment controls must be evaluated and verified against residual risk thresholds." }
]

[[catalogs]]
catalog_id = "CAT-ISO-25010"
standard_id = "ISO-25010-2023"
canonical_id = "ISO/IEC 25010:2023"
edition = "2023"
title = "Systems and Software Quality Models"
controls = [
  { id = "ISO-25010:SECURITY-CONF", title = "Security Confidentiality & Authenticity", statement = "Data access must enforce authenticated identities and prevent unauthorized disclosure." },
  { id = "ISO-25010:SECURITY-INTEG", title = "System Integrity and Non-Repudiation", statement = "System states and logs must be tamper-evident and protected against unauthorized mutation." },
  { id = "ISO-25010:ACCESSIBILITY-COMP", title = "Software Accessibility Compliance", statement = "Interfaces must satisfy universal access criteria for diverse participant abilities." }
]

[[catalogs]]
catalog_id = "CAT-ISO-42010"
standard_id = "ISO-42010-2022"
canonical_id = "ISO/IEC/IEEE 42010:2022"
edition = "2022"
title = "Architecture Description"
controls = [
  { id = "ISO-42010:ARCH-VIEWPOINTS", title = "Explicit Architectural Viewpoints", statement = "Architectural descriptions must articulate explicit viewpoints for distinct stakeholders." },
  { id = "ISO-42010:FRAMEWORK-CONFORM", title = "Architecture Framework Conformance", statement = "Architecture models must formally conform to stated framework principles and concerns." }
]

[[catalogs]]
catalog_id = "CAT-NIST-800-63B"
standard_id = "NIST-SP-800-63B"
canonical_id = "NIST SP 800-63B-4"
edition = "4.2.1.1"
title = "Digital Identity Guidelines - Authentication and Lifecycle Management"
controls = [
  { id = "NIST-800-63B:BACKUP-CODES", title = "Lookup Secrets (Backup Codes) Issuance", statement = "Backup codes must provide at least 128 bits of entropy, be stored salted, and be single-use." },
  { id = "NIST-800-63B:SESSION-INVALIDATION", title = "Session Invalidation upon Credential Recovery", statement = "Redemption of recovery credentials must terminate all prior authenticated user sessions." },
  { id = "NIST-800-63B:REPLAY-PROTECTION", title = "Replay and Rollback Resistance", statement = "Authentication exchanges must reject replayed tokens and enforce monotonic sequence revisions." }
]

[[catalogs]]
catalog_id = "CAT-W3C-WCAG-2-2"
standard_id = "W3C-WCAG-2-2"
canonical_id = "W3C WCAG 2.2"
edition = "2.2-AA"
title = "Web Content Accessibility Guidelines 2.2 Level AA"
controls = [
  { id = "WCAG-2.2:1.1.1-NON-TEXT", title = "Non-text Content Alternatives", statement = "All non-text content presented to users has a text alternative that serves equivalent purpose." },
  { id = "WCAG-2.2:1.4.3-CONTRAST", title = "Contrast (Minimum)", statement = "Visual presentation of text has a contrast ratio of at least 4.5:1." },
  { id = "WCAG-2.2:2.1.1-KEYBOARD", title = "Keyboard Accessible", statement = "All functionality of the content is operable through a keyboard interface without exception." },
  { id = "WCAG-2.2:3.3.1-ERROR-ID", title = "Error Identification", statement = "Input errors are automatically detected and described to the user in text with guidance." }
]

[[profiles]]
profile_id = "PROF-FOUNDRY-PRODUCTION"
title = "UOR Foundry Production Profile"
import_catalogs = [
  "CAT-PRISM-BASE",
  "CAT-ISO-27034-1",
  "CAT-ISO-27034-5",
  "CAT-ISO-27005",
  "CAT-ISO-25010",
  "CAT-ISO-42010",
  "CAT-NIST-800-63B",
  "CAT-W3C-WCAG-2-2"
]
mandatory_base_profile = "CAT-PRISM-BASE"
excluded_controls = []

[[components]]
component_id = "COMP-PRISMPM-SDK"
title = "PrismPM Immutable SDK & Proof Assistant Runtime"
component_type = "upstream-platform"
implemented_requirements = [
  { control_id = "PRISM-BASE-01", description = "Immutable OCI container digests and deterministic content-addressed store.", status = "implemented" },
  { control_id = "PRISM-BASE-02", description = "Core-Wasm runtime sandbox executing verified bytecode without host escape.", status = "implemented" },
  { control_id = "PRISM-BASE-03", description = "Honesty gate enforcing 100% automated oracle verification on AMD64 and ARM64.", status = "implemented" },
  { control_id = "ISO-27034-5:ASC-DATA-STRUCT", description = "LexLean formal semantic data structures and verified TOML definitions.", status = "implemented" },
  { control_id = "ISO-42010:ARCH-VIEWPOINTS", description = "LexLean architecture viewpoints and typed projection views.", status = "implemented" }
]

[[components]]
component_id = "COMP-UOR-FOUNDRY-CORE"
title = "UOR Foundry Functional Core & Model Layer"
component_type = "service-core"
implemented_requirements = [
  { control_id = "ISO-27034-1:ASC-AUDIT", description = "Tamper-evident append-only event logs with SHA-256 state transitions.", status = "implemented" },
  { control_id = "ISO-27034-1:ASC-LIFECYCLE", description = "Continuous verification gates executed via pinned container during build.", status = "implemented" },
  { control_id = "ISO-27034-5:PROTOCOL-INTEG", description = "Cryptographic signature validation and non-repudiation on authority actions.", status = "implemented" },
  { control_id = "ISO-27005:RISK-CRITERIA", description = "Modeled availability, RPO/RTO bounds, and fault-tolerance ratios in owner inputs.", status = "implemented" },
  { control_id = "ISO-27005:RISK-TREATMENT", description = "Multi-administrator approval quorums and concurrent lockout fences.", status = "implemented" },
  { control_id = "ISO-25010:SECURITY-CONF", description = "Cryptographic session binding, token hashing, and strict boundary checks.", status = "implemented" },
  { control_id = "ISO-25010:SECURITY-INTEG", description = "Optimistic concurrency revision fencing preventing rollback and replay.", status = "implemented" },
  { control_id = "ISO-42010:FRAMEWORK-CONFORM", description = "Explicit adherence to UOR architecture framework and model schema rules.", status = "implemented" },
  { control_id = "NIST-800-63B:BACKUP-CODES", description = "128-bit salted SHA-256 single-use backup code issuance and redemption.", status = "implemented" },
  { control_id = "NIST-800-63B:SESSION-INVALIDATION", description = "Immediate revocation and invalidation of active sessions on credential recovery.", status = "implemented" },
  { control_id = "NIST-800-63B:REPLAY-PROTECTION", description = "Single-use challenge nonce tokens and revision rollback guards.", status = "implemented" }
]

[[components]]
component_id = "COMP-UOR-FOUNDRY-WEB"
title = "UOR Foundry Browser Native Client & Views"
component_type = "client-presentation"
implemented_requirements = [
  { control_id = "ISO-25010:ACCESSIBILITY-COMP", description = "Keyboard navigable UI, semantic HTML elements, and high contrast styling.", status = "implemented" },
  { control_id = "WCAG-2.2:1.1.1-NON-TEXT", description = "Mandatory alt attributes and text descriptions for all graphic elements.", status = "implemented" },
  { control_id = "WCAG-2.2:1.4.3-CONTRAST", description = "Standard color tokens exceeding 4.5:1 contrast against background.", status = "implemented" },
  { control_id = "WCAG-2.2:2.1.1-KEYBOARD", description = "Complete focus trapping, tab ordering, and keyboard operation of all journeys.", status = "implemented" },
  { control_id = "WCAG-2.2:3.3.1-ERROR-ID", description = "Real-time client input validation with descriptive textual error labels.", status = "implemented" }
]

