# model/producer_release.toml --- complete producer-release specification,
# reproducible generation, service/control/dependency/assessment coverage,
# exact producer identity, artifact tree, outstanding deployment checks,
# and pre-publication evidence binding.
#
# Conformance ID: PR-01 (suite: producer-release)

spec = "foundry/producer-release/1"
stage = "staged-core"

[policy]
enforce_twice_reproducible = true
require_full_service_coverage = true
require_full_control_coverage = true
require_full_assessment_coverage = true
prohibit_draft_preview_substitutes = true
prohibit_handwritten_ui_substitutes = true
prohibit_empty_registers = true
require_signed_pre_publication_evidence = true

[producer_identity]
name = "uor-foundry-producer"
version = "0.1.0"
stage = "staged-core"
repository = "https://github.com/UOR-Foundation/uor-foundry"
