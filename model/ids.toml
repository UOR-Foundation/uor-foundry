# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file. A test
# whose name ends in an ID not listed here fails `check-model`, and an ID listed
# here with no scenario and no test fails it too (CM-02).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# Every row here has a scenario in `features/suites/` and a test whose name ends
# in the ID, lowercased with underscores (R3, CM-02). There is no "pending"
# state: a capability that is not built does not get a row, and every row in this
# file is built.
#
spec = "template/1"

[[id]]
id = "FW-01"
level = "build"
suite = "draft-preview"
statement = "The LexLean-defined draft preview bounds and validates UTF-8 input and renders an explicitly unpublished response through generated Core-Wasm and portable/browser Views."

[[id]]
id = "OI-01"
level = "build"
suite = "owner-inputs"
statement = "Owner-controlled acceptance inputs are approved, bound to cryptographic evidence, and validated across identity, authority quorums, standards, operational approvals, and availability bounds."

[[id]]
id = "KB-01"
level = "build"
suite = "kappa-service"
statement = "The browser object-space service retains inbound transport receiver semantics and executes verified blob reconciliation, rejecting partial, unverified, or disconnected state updates."

[[id]]
id = "OL-01"
level = "build"
suite = "organization-lifecycle"
statement = "Organization lifecycle enforces open creation, provisional creator grants, policy-compliant activation, distinct-user quorum coverage, and cross-organization isolation."

[[id]]
id = "AM-01"
level = "build"
suite = "authority-model"
statement = "The authority model replaces single-owner operations with scoped multi-administrator policies, enforcing distinct-user quorums, atomic post-change coverage, and concurrent lockout protection."

[[id]]
id = "EC-01"
level = "build"
suite = "email-continuity"
statement = "The UOR-native verified email identity continuity protocol enforces browser-native challenge-response enrollment, login, and recovery, rejecting replay, unverified mailbox control, revoked-grant restoration, and unauthorized authority creation."

[[id]]
id = "BC-01"
level = "build"
suite = "backup-codes"
statement = "The saved backup-code recovery protocol enforces NIST SP 800-63B-4 compliant protected issuance, account/revision binding, single-use redemption, rotation, session invalidation, and replay/rollback rejection."

